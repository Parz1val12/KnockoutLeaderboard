<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Win Input</title>
  <script src="script.js" defer></script>
  <link rel="stylesheet" href="style.css">
  <!-- Firebase App (Core SDK) -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>

<!-- Firebase Realtime Database SDK -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="container">
    <a href="index.html" class="nav-link">&larr; Back to Leaderboard</a>

    <!-- Passcode Lock Container -->
    <div id="auth-container" class="auth-box">
      <h2>Admin Access</h2>
      <input type="password" id="admin-pin" placeholder="Enter Admin PIN">
      <button type="button" onclick="checkAdminAccess()">Unlock</button>
      <p id="pin-error"></p>
    </div>

    <!-- Win Input Container (Revealed after authorization) -->
    <div id="input-container" style="display: none;">
      <h2>Update Wins</h2>

      <label for="month-select">Select Target: </label>
      <select id="month-select" onchange="renderInputPage()"></select>

      <form id="wins-form" onsubmit="event.preventDefault(); submitWins();">
        <div id="input-list">
          <!-- Populated dynamically in A-Z order by script.js -->
        </div>
        <button type="submit" class="submit-btn">Submit Wins</button>
      </form>
    </div>
  </div>

</body>
</html>
